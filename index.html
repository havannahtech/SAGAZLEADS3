<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sagaz Motors – Captação de Leads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#0b0b0b;
  --card:#151515;
  --red:#8b0000;
  --text:#fff
}
.light{
  --bg:#f4f4f4;
  --card:#fff;
  --text:#111
}
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:var(--bg);color:var(--text)}
.container{max-width:1100px;margin:auto;padding:16px}
.card{background:var(--card);padding:16px;border-radius:12px;margin-bottom:16px}

input,select,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:none
}

button{
  background:var(--red);
  color:#fff;
  cursor:pointer;
  font-weight:bold;
  transition: 0.3s;
}
button:hover{ opacity: 0.8; }

.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:8px;
  margin-top: 10px;
}

table{width:100%;border-collapse:collapse}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
  font-size:13px
}

.toggle{
  float:right;
  cursor:pointer;
  font-size:18px
}

canvas{max-height:300px}

.inline{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:8px
}

/* HEADER COM LOGO */
.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px
}
.header img{
  height:60px;
}
.header h2{
  margin:0;
}
</style>
</head>

<body>
<div class="container">

<div class="toggle" onclick="document.body.classList.toggle('light')">🌙</div>

<div class="card header">
  <img src="logo-sagaz.png" alt="Sagaz Motors">
  <h2>Captação de Leads – Sagaz Motors</h2>
</div>

<div class="card">
<form id="form">

<input id="nome" placeholder="Nome" required>
<input id="whatsapp" placeholder="WhatsApp (ex: 21999999999)" required title="Somente números">
<input id="produto" placeholder="Modelo / Produto específico">

<select id="origem" required>
  <option value="">Origem do Lead</option>
  <option>Instagram</option>
  <option>Tráfego Pago</option>
  <option>WhatsApp</option>
  <option>Loja Física</option>
  <option>Indicação</option>
  <option>QR Code</option>
</select>

<div class="inline">
  <input id="cep" placeholder="CEP (00000-000)" maxlength="9" onblur="buscarCEP()">
  <input id="numero" placeholder="Número">
</div>

<input id="endereco" placeholder="Endereço completo (preenchimento automático via CEP)" readonly>

<select id="voucher">
  <option value="">Voucher (opcional)</option>
  <option value="R$300">R$ 300</option>
  <option value="R$500">R$ 500</option>
  <option value="R$1000">R$ 1000</option>
  <option value="R$1500">R$ 1500</option>
  <option value="12x sem juros">12x sem juros</option>
  <option value="18x sem juros">18x sem juros</option>
  <option value="24x sem juros">24x sem juros</option>
</select>

<button type="submit" style="font-size: 1.1em; background: #25D366; color: #000;">
    🚀 SALVAR E ENVIAR WHATSAPP
</button>
</form>

<div class="actions">
  <button onclick="exportar('dia')" style="background: #444;">CSV Hoje</button>
  <button onclick="exportar('semana')" style="background: #444;">CSV Semana</button>
  <button onclick="exportar('mes')" style="background: #444;">CSV Mês</button>
</div>
</div>

<div class="card">
<button onclick="gerarGrafico()" style="background: #8b0000;">📊 Atualizar Gráfico</button>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<table>
<thead>
<tr>
  <th>Nome</th>
  <th>Whats</th>
  <th>Origem</th>
  <th>Produto</th>
  <th>Endereço</th>
  <th>Voucher</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>

</div>

<script>
const KEY="sagazLeadsV22";
const ctx=document.getElementById("grafico");
let chart;

function get(){return JSON.parse(localStorage.getItem(KEY))||[]}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

async function buscarCEP(){
  const c = cep.value.replace(/\D/g,"");
  if(c.length!==8) return;
  try {
    const r = await fetch(`https://viacep.com.br/ws/${c}/json/`);
    const d = await r.json();
    if(d.erro) return alert("CEP não encontrado");
    endereco.value = `${d.logradouro}, ${numero.value||""} – ${d.bairro} – ${d.localidade}/${d.uf}`;
  } catch (e) {
    console.error("Erro ao buscar CEP");
  }
}

// FUNÇÃO PRINCIPAL: SALVA E GERA O LINK DO WHATSAPP
form.onsubmit=e=>{
  e.preventDefault();

  // 1. Coleta os dados
  const lead={
    nome:nome.value,
    whatsapp:whatsapp.value.replace(/\D/g,""), // Limpa o whats para salvar
    produto:produto.value,
    origem:origem.value,
    endereco:endereco.value,
    voucher:voucher.value,
    data:new Date().toISOString()
  };

  // 2. Salva no banco local
  const d=get(); 
  d.push(lead); 
  save(d);

  // 3. Prepara a mensagem personalizada
  let msg = `Olá ${lead.nome}! É um prazer ter você conosco! 🚀\n\n`;
  msg += `Gostaria de agradecer imensamente pela sua visita à *Sagaz Motors*. Ficamos muito felizes em apresentar nossas soluções em mobilidade elétrica e inovação para você.\n\n`;
  
  if(lead.voucher){
    msg += `🎁 *PRESENTE ESPECIAL*: Você ganhou um voucher de: *${lead.voucher}*\n\n`;
  }

  msg += `Para que você possa conferir todos os nossos modelos, cores e especificações técnicas com calma, preparei o nosso *Portfólio Digital Interativo*.\n\n`;
  msg += `Pode acessar pelo link abaixo:\n`;
  msg += `👉 https://inovabio.my.canva.site/tabela-motors\n\n`;
  msg += `*Dica:* Basta clicar no link e arrastar para o lado para navegar por todo o catálogo.\n\n`;
  msg += `Se tiver qualquer dúvida sobre autonomia, financiamento ou quiser entender qual modelo melhor se adapta ao seu dia a dia, é só me chamar por aqui. Estamos à disposição!\n\n`;
  msg += `Abraços,\nEquipe Sagaz Motors`;

  // 4. Abre o WhatsApp em nova aba
  window.open(`https://wa.me/55${lead.whatsapp}?text=${encodeURIComponent(msg)}`);

  // 5. Reseta o formulário e atualiza a tabela na tela
  form.reset(); 
  render();
}

function render(){
  lista.innerHTML="";
  get().reverse().forEach(l=>{ // Mostra os mais recentes primeiro
    lista.innerHTML+=`
    <tr>
      <td>${l.nome}</td>
      <td>${l.whatsapp}</td>
      <td>${l.origem}</td>
      <td>${l.produto||"-"}</td>
      <td>${l.endereco||"-"}</td>
      <td>${l.voucher||"-"}</td>
    </tr>`;
  });
}
render();

function exportar(tipo){
  const hoje=new Date();
  let dados=get().filter(l=>{
    const d=new Date(l.data);
    if(tipo==="dia")return d.toDateString()===hoje.toDateString();
    if(tipo==="semana")return (hoje-d)/(1000*60*60*24)<=7;
    if(tipo==="mes")return d.getMonth()===hoje.getMonth();
  });
  let csv="Nome,Whats,Origem,Produto,Endereco,Voucher\n";
  dados.forEach(l=>{
    csv+=`${l.nome},${l.whatsapp},${l.origem},${l.produto},"${l.endereco}",${l.voucher}\n`;
  });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download=`leads-${tipo}.csv`;
  a.click();
}

function gerarGrafico(){
  const c={};
  get().forEach(l=>{
    const d=new Date(l.data).toLocaleDateString();
    c[d]=(c[d]||0)+1;
  });
  if(chart)chart.destroy();
  chart=new Chart(ctx,{
    type:'bar',
    data:{labels:Object.keys(c),datasets:[{label:'Leads',data:Object.values(c), backgroundColor:'#8b0000'}]}
  });
}
</script>
</body>
</html>
